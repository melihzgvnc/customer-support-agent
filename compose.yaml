name: support-agent

services:
  api:
    build:
      context: .
      target: api
    container_name: api
    ports: 
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_healthy
        restart: true
      garage:
        condition: service_healthy
    env_file: .env
    environment:
      DB__S3_ENDPOINT_URL: http://garage:3900
    secrets:
      - llm__openai_api_key
      - llm__openrouter_api_key
      - monitor__langsmith_api_key
      - db__postgres_password
      - db__garage_admin_token
      - db__garage_rpc_secret
      - db__s3_access_key_id
      - db__s3_secret_access_key
      - webhook__zendesk_client_secret

  ingest-worker:
    build:
      context: .
      target: ingest
    profiles: ["ingest"]
    restart: no
    depends_on:
      chromadb:
        condition: service_healthy
    volumes:
      - index_data:data/index

  chromadb:
    image: chromadb/chroma
    container_name: chromadb
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: FALSE
      IS_PERSISTENT: TRUE
    healthcheck:
      test: 
        - CMD
        - bash
        - -c
        - |
          set -e
          exec 3<>/dev/tcp/127.0.0.1/8000
          printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - chroma_data:/data

# Object Storage (S3-compatible) for raw data
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: garage
    environment:
      GARAGE_RPC_SECRET_FILE: /run/secrets/db__garage_rpc_secret
      GARAGE_ADMIN_TOKEN_FILE: /run/secrets/db__garage_admin_token
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/db__s3_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/db__s3_secret_access_key
    secrets:
      - db__garage_admin_token
      - db__garage_rpc_secret
      - db__s3_access_key_id
      - db__s3_secret_access_key
    ports:
      - "3900:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta/
      - garage_data:/var/lib/garage/data/

  db:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB__POSTGRES_USER:?DB__POSTGRES_USER is not set}
      POSTGRES_DB: ${DB__POSTGRES_DB:?DB__POSTGRES_DB is not set}
      POSTGRES_PASSWORD_FILE: /run/secrets/db__postgres_password
    secrets:
      - db__postgres_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  chroma_data:
  index_data:
  garage_meta:
  garage_data:
  pg_data: