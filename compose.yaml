services:
  backend:
    build:
      context: .
      target: api
    ports: 
      - "5000:5000"
    depends on:
      chromadb:
        condition: service_healthy
        restart: true

  ingest:
    build:
      context: .
      target: ingest
    profiles: ["ingest"]
    depends on:
      chromadb:
        condition: service_healthy
    volumes:
      - index_data:data/index

  chromadb:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: FALSE
      IS_PERSISTENT: TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - chroma_data:chroma/chroma

volumes:
  chroma_data:
  index_data: